<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
    <stop stop-color="#F4F8FF"/><stop offset=".55" stop-color="#F9FAFF"/><stop offset="1" stop-color="#FFF1FB"/>
  </linearGradient>
  <linearGradient id="route" x1="300" y1="700" x2="1350" y2="280" gradientUnits="userSpaceOnUse">
