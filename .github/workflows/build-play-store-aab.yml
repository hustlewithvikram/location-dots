name: Build Play Store App Bundle

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown to users (for example, 1.0.1)"
        required: true
        type: string
        default: "1.0.0"
      version_code:
        description: "Positive integer version code (must increase for every Play Console upload)"
        required: true
        type: string
        default: "100"

permissions:
  contents: read

concurrency:
  group: play-store-aab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed Play Store AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Validate version inputs
        shell: bash
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          [[ "$VERSION_NAME" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]{0,49}$ ]] || {
            echo "::error::Invalid version name. Use 1-50 letters, numbers, dots, plus signs, underscores, or hyphens."
            exit 1
          }
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Version code must be a positive integer."
            exit 1
          }
          (( VERSION_CODE <= 2100000000 )) || {
            echo "::error::Version code exceeds the supported Android range."
            exit 1
          }

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0
          validate-wrappers: false

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -f "$SDK_ROOT/platforms/android-37.0/android.jar"
          test -x "$SDK_ROOT/build-tools/37.0.0/aapt2"
          if [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi
          echo "Android SDK verified at $SDK_ROOT"

      - name: Configure permanent release signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.LOCATION_DOTS_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.LOCATION_DOTS_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.LOCATION_DOTS_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.LOCATION_DOTS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "::error::Missing secret LOCATION_DOTS_RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$RELEASE_STORE_PASSWORD" || { echo "::error::Missing secret LOCATION_DOTS_RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "::error::Missing secret LOCATION_DOTS_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "::error::Missing secret LOCATION_DOTS_RELEASE_KEY_PASSWORD"; exit 1; }

          mkdir -p keystore
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > keystore/location-dots-release.jks
          test -s keystore/location-dots-release.jks
          keytool -list -keystore keystore/location-dots-release.jks -storepass "$RELEASE_STORE_PASSWORD" >/dev/null

          {
            printf 'releaseStoreFile=keystore/location-dots-release.jks\n'
            printf 'releaseStorePassword=%s\n' "$RELEASE_STORE_PASSWORD"
            printf 'releaseKeyAlias=%s\n' "$RELEASE_KEY_ALIAS"
            printf 'releaseKeyPassword=%s\n' "$RELEASE_KEY_PASSWORD"
          } > secrets.properties

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Run release lint
        run: gradle :app:lintRelease --stacktrace --no-daemon -PversionCode=${{ inputs.version_code }} -PversionName="${{ inputs.version_name }}"

      - name: Build signed release App Bundle
        run: gradle :app:bundleRelease --stacktrace --no-daemon -PversionCode=${{ inputs.version_code }} -PversionName="${{ inputs.version_name }}"

      - name: Verify bundle and prepare upload artifact
        shell: bash
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"

          # Verify the AAB is signed and its signing certificate can be read.
          jarsigner -verify "$AAB"
          keytool -printcert -jarfile "$AAB" >/dev/null

          mkdir -p play-store-upload
          cp "$AAB" "play-store-upload/location-dots-${VERSION_NAME}-${VERSION_CODE}.aab"
          sha256sum "play-store-upload/location-dots-${VERSION_NAME}-${VERSION_CODE}.aab" > play-store-upload/SHA256SUMS.txt
          {
            echo "Application ID: com.vikram.locationdots"
            echo "Version name: $VERSION_NAME"
            echo "Version code: $VERSION_CODE"
            echo "Git commit: ${GITHUB_SHA}"
            echo "Built at (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Artifact: location-dots-${VERSION_NAME}-${VERSION_CODE}.aab"
          } > play-store-upload/BUILD-INFO.txt

          ls -lh play-store-upload/

      - name: Upload Play Console bundle
        uses: actions/upload-artifact@v4
        with:
          name: location-dots-play-store-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: play-store-upload/*
          if-no-files-found: error
          retention-days: 30
