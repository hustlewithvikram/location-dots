name: Build Debug APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.LOCATION_DOTS_RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.LOCATION_DOTS_RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.LOCATION_DOTS_RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.LOCATION_DOTS_RELEASE_KEY_PASSWORD }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"
          test -f "$SDK_ROOT/platforms/android-37.0/android.jar"
          if [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi
          echo "Created Android SDK compatibility alias:"
          ls -ld "$SDK_ROOT/platforms/android-37" "$SDK_ROOT/platforms/android-37.0"
          test -x "$SDK_ROOT/build-tools/37.0.0/aapt2"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Prepare stable debug signing
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' && env.RELEASE_STORE_PASSWORD != '' && env.RELEASE_KEY_ALIAS != '' && env.RELEASE_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p keystore
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > keystore/location-dots-release.jks
          cat > secrets.properties <<EOF
          releaseStoreFile=keystore/location-dots-release.jks
          releaseStorePassword=$RELEASE_STORE_PASSWORD
          releaseKeyAlias=$RELEASE_KEY_ALIAS
          releaseKeyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon -PversionCode=$((1000 + ${{ github.run_number }})) -PversionName=1.0.0-dev.${{ github.run_number }}

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Lint debug
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: location-dots-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
