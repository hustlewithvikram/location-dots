name: Release Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version name"
        required: true
        default: "1.0.0"
      version_code:
        description: "Release version code"
        required: true
        default: "100"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -d "$SDK_ROOT/platforms/android-37.0"
          test -d "$SDK_ROOT/build-tools/37.0.0"
          test -f "$SDK_ROOT/platforms/android-37.0/android.jar"
          if [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi
          echo "Created Android SDK compatibility alias:"
          ls -ld "$SDK_ROOT/platforms/android-37" "$SDK_ROOT/platforms/android-37.0"
          test -x "$SDK_ROOT/build-tools/37.0.0/aapt2"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Prepare release signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.LOCATION_DOTS_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.LOCATION_DOTS_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.LOCATION_DOTS_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.LOCATION_DOTS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "Missing LOCATION_DOTS_RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$RELEASE_STORE_PASSWORD" || { echo "Missing LOCATION_DOTS_RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "Missing LOCATION_DOTS_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "Missing LOCATION_DOTS_RELEASE_KEY_PASSWORD"; exit 1; }

          mkdir -p keystore
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > keystore/location-dots-release.jks
          cat > secrets.properties <<EOF
          releaseStoreFile=keystore/location-dots-release.jks
          releaseStorePassword=$RELEASE_STORE_PASSWORD
          releaseKeyAlias=$RELEASE_KEY_ALIAS
          releaseKeyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Lint release
        run: ./gradlew :app:lintRelease --stacktrace --no-daemon

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon -PversionCode=${{ inputs.version_code }} -PversionName=${{ inputs.version_name }}

      - name: Build release AAB
        run: ./gradlew :app:bundleRelease --stacktrace --no-daemon -PversionCode=${{ inputs.version_code }} -PversionName=${{ inputs.version_name }}

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/bundle/release/app-release.aab

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: location-dots-${{ inputs.version_name }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
